name: AXN TLD (localhost.run nokey)

on:
  workflow_dispatch:

jobs:
  dns:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Download CoreDNS
        run: |
          curl -sSL -o coredns.tgz https://github.com/coredns/coredns/releases/download/v1.11.3/coredns_1.11.3_linux_amd64.tgz
          tar -xzf coredns.tgz && chmod +x coredns

      - name: Build DoH proxy
        run: |
          cd doh
          go mod init doh
          go get github.com/miekg/dns
          go build -o ../doh-server .

      - name: Start CoreDNS & DoH
        run: |
          ./coredns -conf Corefile > coredns.log 2>&1 &
          sleep 2
          ./doh-server > doh.log 2>&1 &
          sleep 1

      - name: Start SSH tunnel (nokey@localhost.run)
        id: tunnel
        run: |
          # Perintah inti: tunnel port 8053 ke localhost.run sebagai user nokey
          ssh -o StrictHostKeyChecking=no -R 80:localhost:8053 nokey@localhost.run > tunnel.log 2>&1 &
          TUNNEL_PID=$!
          echo "TUNNEL_PID=$TUNNEL_PID" >> $GITHUB_ENV

          # Tunggu URL lhr.life muncul di log
          for i in $(seq 1 30); do
            if grep -qE 'https://[a-zA-Z0-9.-]+\.lhr\.life' tunnel.log; then
              break
            fi
            sleep 1
          done

          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.lhr\.life' tunnel.log | head -1)
          if [ -z "$URL" ]; then
            echo "Tunnel gagal. Log:"; cat tunnel.log; exit 1
          fi

          echo "DOH_URL=$URL" >> $GITHUB_ENV
          {
            echo "## 🎉 DoH Endpoint (.axn via localhost.run/nokey)"
            echo ""
            echo "\`$URL/dns-query\`"
            echo ""
            echo "**Catatan:** Ini tunnel SSH anonim, bukan Cloudflare."
          } >> $GITHUB_STEP_SUMMARY

      - name: Smoke test
        run: |
          sleep 3
          Q=$(python3 -c "import base64;print(base64.urlsafe_b64encode(b'\x12\x34\x01\x00\x00\x01\x00\x00\x00\x00\x00\x00\x03www\x03axn\x00\x00\x01\x00\x01').rstrip(b'=').decode())")
          echo "== www.axn =="
          curl -s -H "Accept: application/dns-message" "$DOH_URL/dns-query?dns=$Q" | xxd | head

      - name: Keep alive
        run: |
          echo "DoH URL: $DOH_URL/dns-query"
          echo "Firefox: network.trr.uri = $DOH_URL/dns-query | network.trr.mode = 3"
          sleep 20000
          kill $TUNNEL_PID || true
